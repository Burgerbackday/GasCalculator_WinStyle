<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip range</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap">
<style>
:root{--bg:#000;--face:#c0c0c0;--hi:#fff;--sh:#808080;--nv:#000080;--gr:#22b14c;--wa:#ff8c1a;--grt:#006400;--wat:#a84300;--raised:inset -1px -1px #0a0a0a,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf;--sunk:inset -1px -1px #fff,inset 1px 1px #808080,inset -2px -2px #dfdfdf,inset 2px 2px #0a0a0a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:#000;font:16px/1.3 "Pixelify Sans","MS Sans Serif","Microsoft Sans Serif",Tahoma,Arial,sans-serif;text-rendering:optimizeSpeed;-webkit-font-smoothing:none}
#wrap{max-width:720px;margin:8px auto 64px;padding:3px;background:var(--face);box-shadow:var(--raised)}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--face);padding-bottom:8px;margin-bottom:6px}
header{display:flex;align-items:center;gap:6px;padding:3px 4px;background:linear-gradient(90deg,var(--nv),#1084d0);color:#fff;font-weight:700}
h1{font-size:1rem;font-weight:700;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbi{display:inline-flex;flex:none}.tbi .ic{width:18px;height:18px}
#pctl{white-space:nowrap}
.wb{display:inline-flex;align-items:center;justify-content:center;width:22px;height:20px;flex:none;background:var(--face);color:#000;box-shadow:var(--raised);font:700 13px/1 Arial,sans-serif}
#taskbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:stretch;gap:4px;padding:4px 3px calc(env(safe-area-inset-bottom,0px) + 3px);background:var(--face);box-shadow:inset 0 1px #dfdfdf,inset 0 2px #fff}
#taskbar button{display:flex;align-items:center;gap:5px;min-height:34px;padding:3px 6px;font-size:.85rem}
#taskbar button:active,#nav button[aria-current="page"],#start[aria-expanded="true"]{padding:4px 5px 2px 7px}
#start{font-weight:700;flex:none}
.sep{width:2px;flex:none;box-shadow:inset 1px 0 #808080,inset -1px 0 #fff}
#nav{display:flex;gap:3px;flex:1;min-width:0}
#nav button{flex:1 1 0;min-width:0;justify-content:flex-start}
#nav button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#nav button[aria-current="page"]{box-shadow:var(--sunk);background:repeating-conic-gradient(#c0c0c0 0 25%,#fff 0 50%) 0 0/2px 2px;font-weight:700}
#start[aria-expanded="true"]{box-shadow:var(--sunk)}
#tray{flex:none;display:flex;align-items:center;padding:0 10px;font-size:.85rem;box-shadow:inset 1px 1px #808080,inset -1px -1px #fff}
.ic{width:16px;height:16px;flex:none}
@media (max-width:480px){#tray{display:none}}
#smenu{position:fixed;left:3px;bottom:calc(env(safe-area-inset-bottom,0px) + 46px);min-width:190px;padding:3px;background:var(--face);box-shadow:var(--raised);z-index:40}
#smenu button{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:6px 10px;box-shadow:none;background:transparent;text-align:left}
#smenu button:active{background:var(--nv);color:#fff}
main{padding:0 10px 4px}
#status{display:flex;gap:3px;margin-top:6px}
#status span{flex:1;min-width:0;padding:3px 8px;font-size:.88rem;box-shadow:inset 1px 1px #808080,inset -1px -1px #fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:380px){.g2{grid-template-columns:1fr}}
section{position:relative;border:1px solid var(--sh);box-shadow:1px 1px 0 var(--hi),inset 1px 1px 0 var(--hi);padding:20px 12px 12px;margin:0 0 22px}
h2{position:absolute;top:-10px;left:8px;margin:0;padding:0 5px;background:var(--face);font-size:1rem;font-weight:400;color:#000}
label,.lbl{display:block;font-size:.88rem;color:#000}
label.full{grid-column:1/-1}
input,select{width:100%;font:inherit;font-size:16px;color:#000;background:#fff;border:0;border-radius:0;box-shadow:var(--sunk);padding:7px 8px;margin-top:4px;min-height:34px}
select{-webkit-appearance:none;appearance:none;padding-right:26px;background-repeat:no-repeat;background-position:right 3px center;background-size:18px 18px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 18 18'><rect width='18' height='18' fill='%23c0c0c0'/><path d='M0 0h17v1H1v16H0z' fill='white'/><path d='M17 0h1v18H0v-1h17z' fill='%23404040'/><path d='M5 7h8l-4 4z' fill='black'/></svg>")}
input[readonly]{background:var(--face)}
input::placeholder{color:#808080}
input:focus,select:focus{outline:1px dotted #000;outline-offset:-4px}
button{font:inherit;color:#000;background:var(--face);border:0;border-radius:0;box-shadow:var(--raised);padding:7px 16px;min-height:34px;cursor:pointer}
button:active{box-shadow:var(--sunk);padding:8px 15px 6px 17px}
button.pri{font-weight:700;outline:1px solid #000}
button[data-a="del"]{color:#a00000}
button:disabled{color:#808080;text-shadow:1px 1px #fff;cursor:not-allowed}
button:focus-visible{outline:1px dotted #000;outline-offset:-5px}
.seg{display:flex;gap:2px;margin-top:4px}
.seg button{flex:1;padding:7px 4px}
.seg button[aria-pressed="true"]{box-shadow:var(--sunk);background:#dfdfdf;font-weight:700}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.det{color:#404040;font-size:.88rem;margin:6px 0 0}
.res{font-size:1.2rem;font-weight:700;margin:12px 0 4px}
.res.ok{color:var(--grt)}.res.bad{color:var(--wat)}
.item{background:#fff;box-shadow:var(--sunk);padding:8px 10px;margin-top:8px}
.item .t{font-weight:700}.item p{margin:4px 0 0}
.chart{overflow-x:auto;margin-top:8px}
.chart svg{width:100%;height:auto;display:block;min-width:300px}
.chart svg text{fill:#000;font:12px "Pixelify Sans",Tahoma,Arial,sans-serif}
</style></head>
<body>
<div id="wrap">
<div id="top"><header><span class="tbi" id="tbi" aria-hidden="true"></span><h1 id="ptitle"></h1><span id="pctl"></span><span class="wb" aria-hidden="true">_</span><span class="wb" aria-hidden="true">□</span><span class="wb" aria-hidden="true">✕</span></header></div>
<main>

<div id="p_car" class="page">
<section><h2>My car</h2><div class="g2">
<label class="full">Name<input data-f="name" maxlength="40"></label>
<label>Type<select data-f="type"><option value="">Not set</option><option>Sedan</option><option>Hatchback</option><option>Wagon</option><option>SUV</option><option>Pickup</option><option>Van</option><option>Sports car</option></select></label>
<label>Condition<select data-f="state"><option value="">Not set</option><option>Excellent</option><option>Good</option><option>Fair</option><option>Needs service</option></select></label>
</div></section>
<section><h2>Consumption factors</h2><div class="g2">
<label>Fuel efficiency (km/l)<input data-f="kmpl" type="number" min="0" step="0.1" inputmode="decimal"></label>
<label>Tank capacity (L)<input data-f="tank" type="number" min="0" step="0.5" inputmode="decimal"></label>
<label>Odometer (km)<input data-f="odo" type="number" min="0" inputmode="decimal"></label>
<label>Tire pressure (psi)<input data-f="psi" type="number" min="0" step="0.5" inputmode="decimal"></label>
<label>Pressure checked on<input data-f="psiDate" type="date"></label>
</div><p id="carlvl" class="det"></p></section>
</div>

<div id="p_fill" class="page" hidden>
<section><h2>New refuel</h2><div class="g2">
<label>Date<input id="r_date" type="date"></label>
<label>Liters added<input id="r_liters" type="number" min="0" step="0.01" inputmode="decimal"></label>
<label>Price per liter ($)<input id="r_price" type="number" min="0" step="0.01" inputmode="decimal"></label>
<label>Total paid<input id="r_total" readonly tabindex="-1"></label>
<label>Odometer at refuel (km)<input id="r_odo" type="number" min="0" inputmode="decimal"></label>
<label>Level after refuel (%)<input id="r_lvl" type="number" min="1" max="100" step="1" inputmode="numeric" placeholder="100 if filled up"></label>
</div><div class="row"><button id="r_save" class="pri">Save refuel</button></div><p id="r_msg" class="det"></p></section>
<section><h2>Recent refuels</h2><div id="fills"></div></section>
</div>

<div id="p_trip" class="page" hidden>
<section><h2>Route</h2><div class="g2">
<label>Distance (km)<input id="dist" type="number" min="0" inputmode="decimal"></label>
<div><span class="lbl">Driving type</span><select id="mode" hidden><option value="0.85">City</option><option value="1">Mixed</option><option value="1.05">Highway</option></select><div class="seg" id="seg" role="group" aria-label="Driving type"></div></div>
</div><p class="det">City gets 15% less than your efficiency; highway gets 5% more.</p></section>
<section><h2>Fuel</h2>
<div id="tmiss"></div>
<div id="tok" hidden><p id="tinfo" class="det" style="margin:0"></p><div id="res" class="res"></div><div class="chart" id="chart"></div>
<div class="row"><button id="go" class="pri">Start trip</button></div><p id="gomsg" class="det"></p></div></section>
<section><h2>Bus fares (separate)</h2>
<p class="det" style="margin:0 0 10px">Compare the same distance by bus. Each fare covers the km you enter.</p>
<label style="margin-bottom:10px">Passengers<input id="pax" type="number" min="1" step="1" inputmode="numeric"></label>
<div id="buses"></div><div class="row"><button id="addbus">Add bus</button></div><div id="busres"></div></section>
</div>

<div id="p_hist" class="page" hidden><section><h2>Trips</h2><div id="hist"></div></section></div>

</main>
<footer id="status"><span id="st1"></span><span id="st2"></span></footer></div>
<div id="taskbar"><button id="start" aria-haspopup="true" aria-expanded="false"><svg class="ic" viewBox="0 0 12 16" aria-hidden="true"><rect x="4" width="4" height="2" fill="#000"/><rect x="1" y="2" width="10" height="13" fill="#fff" stroke="#000"/><rect x="3" y="5" width="6" height="2" fill="#22b14c"/><rect x="3" y="8" width="6" height="2" fill="#22b14c"/><rect x="3" y="11" width="6" height="2" fill="#ff8c1a"/></svg><span>Start</span></button><span class="sep"></span><nav id="nav" aria-label="Windows"></nav><div id="tray"><span id="clock"></span></div></div>
<div id="smenu" hidden></div>
<script>
const KEY="autonomia_v2";
let S={car:{name:"",type:"",state:"",kmpl:0,tank:0,odo:0,psi:0,psiDate:""},fuel:null,fills:[],trips:[],buses:[],pax:1,mode:"1",page:"car"};
try{const r=JSON.parse(localStorage.getItem(KEY)||"null");if(r&&r.car){S=Object.assign(S,r,{car:Object.assign(S.car,r.car)})}}catch(e){}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=v=>"$"+v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toLocaleDateString("en-CA");

const PAGES=[["car","Car"],["fill","Refuel"],["trip","Trip"],["hist","History"]];
const IC={car:'<path d="M2 11V8l1.5-3h9L14 8v3z" fill="#d22" stroke="#000"/><path d="M4.5 6h7l.8 2H3.7z" fill="#9cf"/><rect x="3" y="11" width="3" height="3" fill="#333"/><rect x="10" y="11" width="3" height="3" fill="#333"/>',fill:'<rect x="3" y="2" width="7" height="12" fill="#ff8c1a" stroke="#000"/><rect x="4.5" y="4" width="4" height="3" fill="#cfe"/><path d="M10 6h2l2 2v5" fill="none" stroke="#000"/>',trip:'<path d="M8 15S3 9.5 3 6.5a5 5 0 0 1 10 0C13 9.5 8 15 8 15z" fill="#e22" stroke="#000"/><circle cx="8" cy="6.5" r="1.8" fill="#fff"/>',hist:'<circle cx="8" cy="8" r="6.5" fill="#fff" stroke="#000"/><path d="M8 4v4l3 2" fill="none" stroke="#000" stroke-width="1.3"/>'};
const ico=k=>`<svg class="ic" viewBox="0 0 16 16" aria-hidden="true">${IC[k]}</svg>`;
const items=PAGES.map(p=>`<button data-p="${p[0]}">${ico(p[0])}<span>${p[1]}</span></button>`).join("");
$("nav").innerHTML=items;$("smenu").innerHTML=items;
function smenu(o){$("smenu").hidden=!o;$("start").setAttribute("aria-expanded",String(o))}
$("start").onclick=e=>{e.stopPropagation();smenu($("smenu").hidden)};
$("smenu").onclick=e=>{const b=e.target.closest("[data-p]");if(b)go(b.dataset.p)};
document.addEventListener("click",e=>{if(!$("smenu").hidden&&!e.target.closest("#smenu"))smenu(false)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")smenu(false)});
function go(p){
  S.page=p;save();
  PAGES.forEach(x=>{$("p_"+x[0]).hidden=x[0]!==p});
  document.querySelectorAll("#nav button").forEach(b=>{if(b.dataset.p===p)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  $("ptitle").textContent=PAGES.find(x=>x[0]===p)[1];$("tbi").innerHTML=ico(p);smenu(false);
  if(p==="trip"){renderTrip();calcBus()}
  if(p==="hist")renderHist();
  if(p==="fill")renderFills();
  window.scrollTo(0,0);
}
$("nav").onclick=e=>{const b=e.target.closest("[data-p]");if(b)go(b.dataset.p)};
document.addEventListener("click",e=>{if(e.target.dataset.go)go(e.target.dataset.go)});

function carLvl(){
  const pp=S.fuel!=null&&S.car.tank>0?Math.round(Math.min(S.fuel,S.car.tank)/S.car.tank*100):null;$("pctl").textContent=(pp==null?"--":pp)+" %Left";
  $("st1").textContent="Fuel: "+(S.fuel==null?"--":Math.min(S.fuel,S.car.tank>0?S.car.tank:S.fuel).toFixed(1)+" L");$("st2").textContent="Odometer: "+(S.car.odo>0?S.car.odo+" km":"--");
  $("carlvl").textContent=S.fuel==null?"Current fuel: no refuel saved yet.":`Current fuel: ${S.fuel.toFixed(1)} L${S.car.tank>0?" ("+Math.round(Math.min(S.fuel,S.car.tank)/S.car.tank*100)+"%)":""}.`;
}
function fillCar(){
  document.querySelectorAll("#p_car [data-f]").forEach(el=>{const v=S.car[el.dataset.f];el.value=(v===0||v==null)?"":v});carLvl();
}
$("p_car").addEventListener("input",e=>{
  const f=e.target.dataset.f;if(!f)return;
  S.car[f]=e.target.type==="number"?(parseFloat(e.target.value)||0):e.target.value;save();carLvl();
});

["r_liters","r_price"].forEach(id=>{$(id).oninput=()=>{const t=(parseFloat($("r_liters").value)||0)*(parseFloat($("r_price").value)||0);$("r_total").value=t?money(t):""}});
$("r_save").onclick=()=>{
  const m=t=>{$("r_msg").textContent=t},c=S.car;
  const liters=parseFloat($("r_liters").value),price=parseFloat($("r_price").value),lvl=parseFloat($("r_lvl").value),odo=parseFloat($("r_odo").value)||0;
  if(!(c.tank>0))return m("Enter the tank capacity in Car first.");
  if(!(liters>0))return m("Enter the liters added.");
  if(!(price>0))return m("Enter the price per liter.");
  if(!(lvl>0&&lvl<=100))return m("Level after refuel must be between 1 and 100%.");
  S.fills.unshift({id:Date.now(),date:$("r_date").value||today(),liters,price,odo,lvl});
  S.fuel=c.tank*lvl/100;if(odo>c.odo)c.odo=odo;
  save();["r_liters","r_price","r_total","r_odo","r_lvl"].forEach(id=>{$(id).value=""});$("r_date").value=today();
  fillCar();renderFills();m(`Refuel saved. Current level: ${S.fuel.toFixed(1)} L.`);
};
function renderFills(){
  $("fills").innerHTML=S.fills.length?S.fills.slice(0,5).map(f=>`<div class="item"><div class="t">${esc(f.date)}</div><p class="det">${f.liters} L · ${money(f.price)}/L · total ${money(f.liters*f.price)}${f.odo?" · "+f.odo+" km":""} · level ${f.lvl}%</p></div>`).join(""):'<p class="det" style="margin:0">No refuels saved yet.</p>';
}

function miss(){
  const c=S.car,m=[];
  if(!(c.kmpl>0))m.push("fuel efficiency (km/l)");
  if(!(c.tank>0))m.push("tank capacity");
  if(S.fuel==null)m.push("a saved refuel");
  return m;
}
function T(){
  if(miss().length)return null;
  const c=S.car,dist=parseFloat($("dist").value)||0,eff=c.kmpl*parseFloat($("mode").value);
  const fuel=Math.min(S.fuel,c.tank),price=S.fills[0].price,need=dist/eff;
  return{c,dist,eff,fuel,price,need,cost:need*price,after:fuel-need};
}
function renderTrip(){
  const m=miss();$("tmiss").hidden=!m.length;$("tok").hidden=!!m.length;
  if(m.length){
    $("tmiss").innerHTML=`<p style="margin:0">To calculate, you still need: ${m.join(", ")}.</p><div class="row">${(!(S.car.kmpl>0)||!(S.car.tank>0))?'<button data-go="car">Go to Car</button>':""}${S.fuel==null?'<button data-go="fill">Go to Refuel</button>':""}</div>`;
    return;
  }
  const t=T(),r=$("res"),reserve=t.c.tank*.1,total=t.fuel*t.eff,usable=Math.max(0,t.fuel-reserve)*t.eff;
  if(!(t.dist>0)){r.className="res";r.textContent="Enter a distance to calculate."}
  else if(t.dist<=usable){r.className="res ok";r.textContent=`You arrive with ${t.after.toFixed(1)} L to spare`}
  else if(t.need<=t.fuel){r.className="res bad";r.textContent="You make it, but dipping into reserve"}
  else{r.className="res bad";r.textContent=`You're ${(t.dist-total).toFixed(0)} km short: refuel first`}
  $("tinfo").textContent=`${t.eff.toFixed(1)} km/l effective · range ${total.toFixed(0)} km · ${money(t.price)}/L from last refuel`;
  $("go").disabled=!(t.dist>0)||t.need>t.fuel;
  chart(t);
}
function chart(t){
  const c=t.c,W=600,H=210,x0=22,iw=520,y0=78,bh=64,N=20,gap=4,bw=(iw-gap*(N-1))/N,use=Math.min(t.need,t.fuel),rem=t.fuel-use,reserve=c.tank*.1,px=v=>v/c.tank*iw;
  let g=`<rect x="8" y="${y0-8}" width="552" height="${bh+16}" fill="#c0c0c0"/><path d="M8 ${y0-8}h552v2H10v${bh+14}H8z" fill="#808080"/><path d="M560 ${y0-8}v${bh+16}H8v-2h550V${y0-8}z" fill="#fff"/><rect x="560" y="${y0+bh/2-18}" width="14" height="36" fill="#404040"/>`;
  for(let i=0;i<N;i++){
    const m=(i+.5)/N*c.tank,col=m<=rem?"var(--gr)":(m<=t.fuel?"var(--wa)":null);
    if(col)g+=`<rect x="${x0+i*(bw+gap)}" y="${y0}" width="${bw}" height="${bh}" fill="${col}"/>`;
  }
  g+=`<line x1="${x0+px(reserve)}" x2="${x0+px(reserve)}" y1="${y0-5}" y2="${y0+bh+5}" stroke="#000" stroke-dasharray="3 3"/>`;
  if(t.dist>0){
    const mx=x0+px(rem)+px(use)/2,bw2=150,bx=Math.min(Math.max(mx-bw2/2,8),566-bw2);
    g+=`<line x1="${mx}" x2="${mx}" y1="54" y2="${y0-8}" stroke="#000"/>
    <rect x="${bx}" y="6" width="${bw2}" height="48" fill="var(--wa)" stroke="#000"/>
    <text x="${bx+bw2/2}" y="28" text-anchor="middle" style="font-size:17px;font-weight:700">${money(t.cost)}</text>
    <text x="${bx+bw2/2}" y="46" text-anchor="middle" style="font-size:12px">${t.need.toFixed(1)} L of fuel</text>`;
  }
  const l1=`Now ${t.fuel.toFixed(1)} L (${Math.round(t.fuel/c.tank*100)}%)`+(t.dist>0?(t.need>t.fuel?` · short by ${(t.need-t.fuel).toFixed(1)} L`:` · on arrival ${rem.toFixed(1)} L`):"");
  g+=`<text x="8" y="${y0+bh+34}">${l1}</text><text x="8" y="${y0+bh+54}">Green: fuel left · Orange: trip use · Dashed: reserve</text>`;
  $("chart").innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Fuel battery: ${t.fuel.toFixed(1)} liters now">${g}</svg>`;
}
$("dist").oninput=()=>{$("gomsg").textContent="";renderTrip();calcBus()};
$("mode").onchange=e=>{S.mode=e.target.value;save();renderTrip();calcBus()};
$("go").onclick=()=>{
  const t=T();if(!t||!(t.dist>0)||t.need>t.fuel)return;
  S.trips.unshift({id:Date.now(),ts:new Date().toISOString(),dist:t.dist,mode:$("mode").selectedOptions[0].text,before:t.fuel,after:t.after,used:t.need,cost:t.cost,price:t.price,tank:t.c.tank});
  S.fuel=t.after;if(t.c.odo>0)t.c.odo+=t.dist;
  save();$("dist").value="";fillCar();renderTrip();calcBus();
  $("gomsg").textContent=`Trip started: -${t.need.toFixed(1)} L. Current level: ${t.after.toFixed(1)} L.`;
};

function drawBuses(){
  $("buses").innerHTML=S.buses.map(b=>`<div class="item" data-id="${b.id}"><div class="g2">
  <label class="full">Name<input data-f="name" value="${esc(b.name)}"></label>
  <label>Fare price ($)<input data-f="fare" type="number" min="0" step="0.5" inputmode="decimal" value="${b.fare||""}"></label>
  <label>Km per fare<input data-f="km" type="number" min="1" inputmode="decimal" value="${b.km||""}"></label></div>
  <div class="row"><button data-a="del">Delete</button></div></div>`).join("");
}
$("buses").addEventListener("input",e=>{
  const card=e.target.closest("[data-id]"),f=e.target.dataset.f;if(!card||!f)return;
  const b=S.buses.find(x=>x.id==card.dataset.id);b[f]=f==="name"?e.target.value:(parseFloat(e.target.value)||0);save();calcBus();
});
$("buses").addEventListener("click",e=>{
  if(e.target.dataset.a!=="del")return;
  const id=+e.target.closest("[data-id]").dataset.id;S.buses=S.buses.filter(b=>b.id!==id);save();drawBuses();calcBus();
});
$("addbus").onclick=()=>{S.buses.push({id:Date.now(),name:"Bus "+(S.buses.length+1),fare:0,km:0});save();drawBuses();calcBus()};
$("pax").oninput=e=>{S.pax=parseInt(e.target.value)||1;save();calcBus()};
function calcBus(){
  const d=parseFloat($("dist").value)||0,pax=Math.max(1,S.pax||1),t=T();
  $("busres").innerHTML=S.buses.map(b=>{
    const nm=esc(b.name||"Bus");
    if(!(d>0&&b.fare>0&&b.km>0))return `<div class="item"><b>${nm}</b><p class="det">Enter distance, fare price and km per fare.</p></div>`;
    const n=Math.ceil(d/b.km),tot=n*b.fare*pax;
    const cmp=t&&t.cost>0?(tot<t.cost?`<span style="color:var(--grt)">${money(t.cost-tot)} less than driving</span>`:`<span style="color:var(--wat)">${money(tot-t.cost)} more than driving</span>`):"";
    return `<div class="item"><div class="t">${nm}: ${money(tot)}</div><p class="det">${n} fares × ${money(b.fare)}${pax>1?" × "+pax+" people":""}</p><p>${cmp}</p></div>`;
  }).join("");
}

function renderHist(){
  const pc=(v,tk)=>Math.round(v/tk*100);
  $("hist").innerHTML=S.trips.length?S.trips.map(t=>`<div class="item"><div class="t">${esc(new Date(t.ts).toLocaleString("en-US",{dateStyle:"medium",timeStyle:"short"}))} · ${t.dist} km</div>
  <p>Level before: ${t.before.toFixed(1)} L (${pc(t.before,t.tank)}%) → after: ${t.after.toFixed(1)} L (${pc(t.after,t.tank)}%)</p>
  <p class="det">Used ${t.used.toFixed(1)} L · ${money(t.cost)} (${money(t.price)}/L) · ${esc(t.mode)} driving</p></div>`).join(""):'<p class="det" style="margin:0">No trips yet. Start one from Trip.</p>';
}

function syncSeg(){document.querySelectorAll("#seg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===$("mode").value)))}
$("seg").innerHTML=[...$("mode").options].map(o=>`<button data-v="${o.value}">${o.text}</button>`).join("");
$("seg").onclick=e=>{const b=e.target.closest("button");if(!b)return;$("mode").value=b.dataset.v;$("mode").dispatchEvent(new Event("change"));syncSeg()};
function tick(){$("clock").textContent=new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})}
tick();setInterval(tick,30000);
$("r_date").value=today();$("pax").value=S.pax;$("mode").value=S.mode;syncSeg();
fillCar();drawBuses();renderFills();
go(PAGES.some(p=>p[0]===S.page)?S.page:"car");
</script></body></html>
